[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid3d"
version = "0.1.0"
description = "Turn a walkthrough video into a measurable 3D point cloud and floor plan"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pycolmap>=4",
  "torch",
  "transformers",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vid3d = "vid3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
