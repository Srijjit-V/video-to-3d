[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid3d"
version = "0.1.0"
description = "Turn a walkthrough video into a measurable 3D point cloud and floor plan"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pycolmap>=4",
  "torch",
  "transformers",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "playwright", "ruff", "mypy", "pip-audit"]

[project.scripts]
vid3d = "vid3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E741"]  # short names (l, O) are normal in the maths code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S108", "S310", "E501"]  # asserts and subprocess are what tests do
"scripts/*" = ["S603", "S607", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/vid3d"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
